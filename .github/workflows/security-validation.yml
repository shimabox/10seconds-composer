name: Security dependency validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Security fixes - typecheck, build and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Use project Node.js version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.18.0'
      - name: Immutable dependency install
        run: npx --yes --package @yarnpkg/cli-dist@4.1.1 yarn install --immutable
      - name: Verify original 56 vulnerable dependency ranges
        run: node .github/scripts/security-ranges.cjs
      - name: TypeScript validation
        run: npx --yes --package @yarnpkg/cli-dist@4.1.1 yarn exec tsc --noEmit
      - name: Production build (existing Babel and ESLint warnings remain visible)
        run: npx --yes --package @yarnpkg/cli-dist@4.1.1 yarn build
      - name: Native image and unauthenticated UI smoke
        run: npx --yes --package @yarnpkg/cli-dist@4.1.1 yarn node .github/scripts/smoke.cjs
      - name: Full dependency audit report (not a clean-audit gate)
        if: always()
        shell: bash
        run: |
          set +e
          npx --yes --package @yarnpkg/cli-dist@4.1.1 yarn npm audit --all --recursive --json > audit.jsonl 2>&1
          audit_status=$?
          set -e
          cat audit.jsonl
          node -e 'const fs = require("node:fs"); const raw = fs.readFileSync("audit.jsonl", "utf8").trim(); const rows = raw ? raw.split("\n").map(JSON.parse) : []; if (rows.some(row => !row.children)) throw new Error("Unexpected audit response"); console.log("Reported findings:", rows.length);'
          {
            echo '## Full dependency audit'
            echo "Audit command exit code: $audit_status"
            echo 'This step reports the complete audit; it does not certify a clean dependency tree.'
            echo 'Known remaining advisory: GHSA-vfj7-8cjw-p6xm, braces <=3.0.3. No patched release is available; Jest type dependencies still depend on it.'
            echo 'Existing Babel deprecation and missing ESLint warnings are not waived or hidden.'
            echo '```json'
            cat audit.jsonl
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$audit_status" -eq 1 ]; then
            echo '::warning::Dependency audit returned 1; vulnerabilities/deprecations remain. Review the full audit artifact and summary.'
          elif [ "$audit_status" -ne 0 ]; then
            exit "$audit_status"
          fi
      - name: Preserve complete audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-audit-report
          path: audit.jsonl
          if-no-files-found: error
