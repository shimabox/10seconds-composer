name: Security dependency validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Security fixes - typecheck, build and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Use project Node.js version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.18.0'
      - name: Immutable dependency install
        run: npx --yes --package @yarnpkg/cli-dist@4.1.1 yarn install --immutable
      - name: Verify original 56 vulnerable dependency ranges
        run: node .github/scripts/security-ranges.cjs
      - name: TypeScript validation
        run: npx --yes --package @yarnpkg/cli-dist@4.1.1 yarn exec tsc --noEmit
      - name: Production build (existing Babel and ESLint warnings remain visible)
        run: npx --yes --package @yarnpkg/cli-dist@4.1.1 yarn build
      - name: Native image and unauthenticated UI smoke
        run: npx --yes --package @yarnpkg/cli-dist@4.1.1 yarn node .github/scripts/smoke.cjs
      - name: Full dependency audit (fail on security findings)
        if: always()
        shell: bash
        run: |
          set +e
          npx --yes --package @yarnpkg/cli-dist@4.1.1 yarn npm audit --all --recursive --json > audit.jsonl 2>&1
          audit_status=$?
          set -e
          cat audit.jsonl
          node .github/scripts/check-audit.cjs audit.jsonl
          {
            echo '## Full dependency audit'
            echo "Audit command exit code: $audit_status"
            echo 'Security findings fail this job; deprecation notices remain visible below.'
            echo 'Unused Jest/Testing Library dependencies were removed to eliminate the braces path.'
            echo 'Existing Babel deprecation and missing ESLint warnings are not waived or hidden.'
            echo '```json'
            cat audit.jsonl
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$audit_status" -eq 1 ]; then
            echo '::warning::Dependency audit returned deprecation notices; security findings are checked separately and fail the job.'
          elif [ "$audit_status" -ne 0 ]; then
            exit "$audit_status"
          fi
      - name: Preserve complete audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-audit-report
          path: audit.jsonl
          if-no-files-found: error
